name: nodetls release

# Builds cffi_dist (upstream's shared library plus the completion queue in
# async.go) for every platform node-tls-client downloads, smoke-tests it on
# native runners and publishes a release with the libraries, licence notices
# and checksums. Asset names match upstream's xgo names, so node-tls-client
# needs no second table.
#
# - push of a tag v<tls-client version>-nodetls.<n>: build, test, release.
# - called by nodetls-sync.yml with the tag it just pushed: the same (a tag
#   pushed with GITHUB_TOKEN doesn't trigger workflows by itself).
# - workflow_dispatch: build and smoke-test the current branch, no release.

on:
  push:
    tags: ["v*-nodetls.*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v*-nodetls.*) version="${tag#v}" ;;
            *) tag=""; version="0.0.0-dev" ;;
          esac
          # The tag names the tls-client version cffi_dist is built against.
          if [ -n "$tag" ]; then
            have=$(awk '$1 == "github.com/bogdanfinn/tls-client" { print $2 }' cffi_dist/go.mod)
            if [ "v${version%%-nodetls.*}" != "$have" ]; then
              echo "::error::tag $tag, but cffi_dist/go.mod builds tls-client $have"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "go=$(awk '$1 == "go" { print $2 }' cffi_dist/go.mod)" >> "$GITHUB_OUTPUT"

      - uses: crazy-max/ghaction-xgo@de82f877ff4552f03b66c146f608233849e9c3dc # v4.0.0
        with:
          go_version: ${{ steps.version.outputs.go }}.x
          working_dir: cffi_dist
          dest: ${{ github.workspace }}/dist
          prefix: tls-client-xgo-${{ steps.version.outputs.version }}
          targets: darwin/amd64,darwin/arm64,linux/386,linux/amd64,linux/arm-5,linux/arm-6,linux/arm-7,linux/arm64,linux/ppc64le,linux/riscv64,linux/s390x,windows/386,windows/amd64
          buildmode: c-shared
          trimpath: true

      - name: Every name node-tls-client downloads exists
        run: |
          sudo chown -R "$(id -u)" dist
          rm -f dist/*.h
          missing=""
          for target in darwin-amd64.dylib darwin-arm64.dylib linux-386.so linux-amd64.so \
            linux-arm-5.so linux-arm-6.so linux-arm-7.so linux-arm64.so linux-ppc64le.so \
            linux-riscv64.so linux-s390x.so windows-386.dll windows-amd64.dll; do
            file="dist/tls-client-xgo-${{ steps.version.outputs.version }}-$target"
            [ -s "$file" ] || { echo "::error::missing $file"; missing=1; }
          done
          ls -l dist
          [ -z "$missing" ]

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cffi_dist/go.mod
          cache-dependency-path: cffi_dist/go.sum

      - name: Licence notices
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          .github/nodetls/notices.sh dist/THIRD_PARTY_NOTICES.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libraries
          path: dist/
          if-no-files-found: error

  # Load each library on its own platform the way node-tls-client does (koffi)
  # and run requests through both exports. Windows matters most: the uint64
  # out-parameter and cgo threads.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64.so }
          - { os: ubuntu-24.04-arm, target: linux-arm64.so }
          - { os: macos-latest, target: darwin-arm64.dylib }
          - { os: windows-latest, target: windows-amd64.dll }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: .github/nodetls
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: dist
      - name: Smoke test
        run: |
          npm install --prefix "$RUNNER_TEMP/smoke" --no-save --no-package-lock koffi@2.15.2
          NODE_PATH="$RUNNER_TEMP/smoke/node_modules" node .github/nodetls/smoke.cjs \
            "dist/tls-client-xgo-${{ needs.build.outputs.version }}-${{ matrix.target }}"

  release:
    needs: [build, smoke]
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          upstream="${TAG%%-nodetls.*}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          tls-client [$upstream](https://github.com/bogdanfinn/tls-client/releases/tag/$upstream), built for [node-tls-client](https://github.com/Sahil1337/node-tls-client).

          The only addition to upstream's code is [\`cffi_dist/async.go\`](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/cffi_dist/async.go): \`requestAsync\` / \`waitNext\`, a completion queue that lets a host run many requests without holding one thread per request. The \`request\` export and everything else are unchanged.

          Built by [this workflow](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$TAG\`. Checksums: \`SHA256SUMS\`. Licences: \`THIRD_PARTY_NOTICES.txt\`.
          NOTES
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
